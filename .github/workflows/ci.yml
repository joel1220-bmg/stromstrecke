# The same gate as verify.ps1, on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # LayoutProps and the route types are generated by Next, normally as a
      # side effect of `next dev` or `next build`. A fresh checkout has
      # neither, so tsc would fail before the build ever ran.
      - name: Next-Typen erzeugen
        run: npx next typegen

      - name: Typen
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Build (statischer Export)
        run: npx next build
