# The same gate as verify.ps1, on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typen
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .

      - name: Build (statischer Export)
        run: npx next build
